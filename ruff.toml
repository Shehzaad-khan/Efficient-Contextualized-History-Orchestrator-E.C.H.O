# Lint rules for CI (.github/workflows/ci.yml). Deliberately small: only real bugs, no style opinions.
#   E9  syntax errors            F63  wrong comparisons/assertions   F7  misplaced statements
#   F82 undefined names
exclude = ["docs", "frontend", "extension", ".venv", "venv"]
target-version = "py311"

[lint]
select = ["E9", "F63", "F7", "F82"]
