[pytest]
testpaths = tests
addopts = -ra --import-mode=importlib
markers =
    unit: one function or class at a time, everything outside it mocked
    integration: several real modules together, only external services (PostgreSQL, Redis, LLM) faked
    system: one whole user flow through the app, only external services faked
filterwarnings =
    ignore::DeprecationWarning
